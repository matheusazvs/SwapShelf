name: SwapShelf CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Tests and quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff
        run: ruff check .

      - name: Run unit tests
        run: python -m pytest tests/unit -v

      - name: Check Catalog Dockerfile
        run: docker run --rm -i hadolint/hadolint < services/catalog/Dockerfile

      - name: Check Exchange Dockerfile
        run: docker run --rm -i hadolint/hadolint < services/exchange/Dockerfile

      - name: Start integration environment
        run: docker compose up -d --build

      - name: Run integration tests
        run: python -m pytest tests/integration -v

      - name: Stop integration environment
        if: always()
        run: docker compose down -v

  publish:
    name: Build and publish images
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Catalog image metadata
        id: catalog-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/swapshelf-catalog
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish Catalog
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/catalog/Dockerfile
          push: true
          tags: ${{ steps.catalog-meta.outputs.tags }}
          labels: ${{ steps.catalog-meta.outputs.labels }}

      - name: Generate Exchange image metadata
        id: exchange-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/swapshelf-exchange
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish Exchange
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/exchange/Dockerfile
          push: true
          tags: ${{ steps.exchange-meta.outputs.tags }}
          labels: ${{ steps.exchange-meta.outputs.labels }}
